name: Mise à jour quotidienne de la carte

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exécuter les tests unitaires
        run: python -m unittest discover -s tests -v
      - uses: actions/cache@v4
        with:
          path: .geocache.sqlite
          key: geocache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geocache-v1-
      - name: Collecter les événements
        env:
          GEOCODER_CONTACT: ${{ github.server_url }}/${{ github.repository }}
          NOMINATIM_URL: ${{ vars.NOMINATIM_URL || 'https://nominatim.openstreetmap.org/search' }}
        run: python collect.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
